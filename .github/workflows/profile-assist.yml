name: Profile assets

# Builds the contribution snake and the stats cards, then publishes them
# together to the `output` branch in a single commit, so neither set of
# files overwrites the other:
#   output/github-snake.svg, output/github-snake-dark.svg
#   output/stats/{stats,top-langs}{,-dark}.svg

on:
  schedule:
    - cron: "17 0 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats cards
        run: python3 scripts/profile_stats.py "${{ github.repository_owner }}" dist/stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # snk runs in a root container, so it comes after the runner has created dist/
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Check that every file was generated
        run: |
          for f in github-snake.svg github-snake-dark.svg \
                   stats/stats.svg stats/stats-dark.svg \
                   stats/top-langs.svg stats/top-langs-dark.svg; do
            test -s "dist/$f" || { echo "missing dist/$f"; exit 1; }
          done

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update profile assets"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}